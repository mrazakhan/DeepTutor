<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- === BOOK === -->
  <!-- Book back cover (slight offset for thickness) -->
  <rect x="8" y="30" width="32" height="3" rx="1" fill="#6366F1" opacity="0.25"/>
  <!-- Book front cover -->
  <rect x="7" y="28" width="34" height="3" rx="1" stroke="#6366F1" stroke-width="1.3" fill="white"/>
  <!-- Book pages (visible from side, between covers) -->
  <line x1="9" y1="31" x2="39" y2="31" stroke="#6366F1" stroke-width="0.5" opacity="0.3"/>
  <line x1="9" y1="31.8" x2="39" y2="31.8" stroke="#6366F1" stroke-width="0.4" opacity="0.2"/>
  <!-- Open top pages fanning out -->
  <path d="M7 28 Q7 24 10 23 Q17 21 24 22" stroke="#6366F1" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M41 28 Q41 24 38 23 Q31 21 24 22" stroke="#6366F1" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Spine line -->
  <line x1="24" y1="22" x2="24" y2="28" stroke="#6366F1" stroke-width="0.8" opacity="0.4"/>
  <!-- Text lines on left page -->
  <path d="M12 24.5 Q18 23.5 22 24" stroke="#6366F1" stroke-width="0.5" opacity="0.25"/>
  <path d="M12 26 Q18 25 22 25.5" stroke="#6366F1" stroke-width="0.5" opacity="0.25"/>
  <!-- Text lines on right page -->
  <path d="M26 24 Q30 23.5 36 24.5" stroke="#6366F1" stroke-width="0.5" opacity="0.25"/>
  <path d="M26 25.5 Q30 25 36 26" stroke="#6366F1" stroke-width="0.5" opacity="0.25"/>

  <!-- === NEURAL NETWORK as "D" shape (rotated 90°) === -->
  <!-- The "D" has a vertical left edge and curved right side -->

  <!-- Vertical left side nodes (the straight part of D) -->
  <!-- Connections from left column to curved right nodes -->
  <line x1="14" y1="5" x2="28" y2="5" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="14" y1="5" x2="32" y2="10" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="14" y1="10" x2="32" y2="10" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="14" y1="10" x2="28" y2="5" stroke="url(#g1)" stroke-width="0.8" opacity="0.25"/>
  <line x1="14" y1="10" x2="34" y2="15" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="14" y1="15" x2="34" y2="15" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="14" y1="15" x2="32" y2="10" stroke="url(#g1)" stroke-width="0.8" opacity="0.25"/>
  <line x1="14" y1="15" x2="32" y2="19" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="14" y1="19" x2="32" y2="19" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="14" y1="19" x2="34" y2="15" stroke="url(#g1)" stroke-width="0.8" opacity="0.25"/>
  <line x1="14" y1="19" x2="28" y2="19" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>

  <!-- Vertical line connecting left nodes (backbone of D) -->
  <line x1="14" y1="5" x2="14" y2="19" stroke="url(#g1)" stroke-width="1" opacity="0.4"/>

  <!-- Left column nodes (straight edge of D) -->
  <circle cx="14" cy="5" r="2.5" fill="url(#g1)"/>
  <circle cx="14" cy="10" r="2.5" fill="url(#g1)" opacity="0.85"/>
  <circle cx="14" cy="15" r="2.5" fill="url(#g1)" opacity="0.85"/>
  <circle cx="14" cy="19" r="2.5" fill="url(#g1)"/>

  <!-- Curved right nodes (the bump of D) -->
  <circle cx="28" cy="5" r="2" fill="url(#g1)" opacity="0.7"/>
  <circle cx="32" cy="10" r="2.2" fill="url(#success)" opacity="0.85"/>
  <circle cx="34" cy="15" r="2.5" fill="url(#success)"/>
  <circle cx="32" cy="19" r="2.2" fill="url(#success)" opacity="0.85"/>
  <circle cx="28" cy="19" r="2" fill="url(#g1)" opacity="0.7"/>

  <!-- Subtle glow on the rightmost node -->
  <circle cx="34" cy="15" r="5" fill="#10B981" opacity="0.08"/>
</svg>
