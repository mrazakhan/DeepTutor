<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 52" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- === WIDE OPEN BOOK === -->
  <!-- Left page (angled open) -->
  <path d="M32 42 L32 35 Q32 33 30 32.5 L6 28 Q3 27.5 2 29 L2 38 Q2 39.5 4 40 L30 44 Q32 44.5 32 42 Z"
        fill="white" stroke="#6366F1" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right page (angled open) -->
  <path d="M32 42 L32 35 Q32 33 34 32.5 L58 28 Q61 27.5 62 29 L62 38 Q62 39.5 60 40 L34 44 Q32 44.5 32 42 Z"
        fill="white" stroke="#6366F1" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Page thickness — stacked pages underneath -->
  <path d="M3 39 L31 43.5" stroke="#A5B4FC" stroke-width="0.5" opacity="0.5"/>
  <path d="M3 40 L31 44.5" stroke="#A5B4FC" stroke-width="0.4" opacity="0.35"/>
  <path d="M61 39 L33 43.5" stroke="#A5B4FC" stroke-width="0.5" opacity="0.5"/>
  <path d="M61 40 L33 44.5" stroke="#A5B4FC" stroke-width="0.4" opacity="0.35"/>

  <!-- Bottom page edges (book thickness) -->
  <path d="M2 38 Q2 40.5 4 41 L30 45.5 Q32 46 32 44" stroke="#6366F1" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M62 38 Q62 40.5 60 41 L34 45.5 Q32 46 32 44" stroke="#6366F1" stroke-width="0.8" fill="none" opacity="0.3"/>

  <!-- Text lines on left page -->
  <line x1="8" y1="32" x2="26" y2="35" stroke="#A5B4FC" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
  <line x1="9" y1="34" x2="27" y2="37" stroke="#A5B4FC" stroke-width="0.7" opacity="0.35" stroke-linecap="round"/>
  <line x1="10" y1="36" x2="28" y2="39" stroke="#A5B4FC" stroke-width="0.6" opacity="0.3" stroke-linecap="round"/>

  <!-- Text lines on right page -->
  <line x1="56" y1="32" x2="38" y2="35" stroke="#A5B4FC" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
  <line x1="55" y1="34" x2="37" y2="37" stroke="#A5B4FC" stroke-width="0.7" opacity="0.35" stroke-linecap="round"/>
  <line x1="54" y1="36" x2="36" y2="39" stroke="#A5B4FC" stroke-width="0.6" opacity="0.3" stroke-linecap="round"/>

  <!-- Spine curve -->
  <path d="M32 35 L32 44" stroke="#6366F1" stroke-width="0.6" opacity="0.3"/>

  <!-- === NEURAL NETWORK |> rising from book === -->

  <!-- Connections: left column to middle -->
  <line x1="18" y1="6" x2="30" y2="8" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="6" x2="30" y2="15" stroke="#818CF8" stroke-width="0.8" opacity="0.25"/>
  <line x1="18" y1="12" x2="30" y2="8" stroke="#818CF8" stroke-width="0.8" opacity="0.25"/>
  <line x1="18" y1="12" x2="30" y2="15" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="12" x2="30" y2="22" stroke="#818CF8" stroke-width="0.8" opacity="0.25"/>
  <line x1="18" y1="18" x2="30" y2="15" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="18" x2="30" y2="22" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="24" x2="30" y2="22" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="24" x2="30" y2="15" stroke="#818CF8" stroke-width="0.8" opacity="0.25"/>

  <!-- Connections: middle to tip -->
  <line x1="30" y1="8" x2="44" y2="15" stroke="#A78BFA" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="15" x2="44" y2="15" stroke="#A78BFA" stroke-width="1.1" opacity="0.45"/>
  <line x1="30" y1="22" x2="44" y2="15" stroke="#A78BFA" stroke-width="1" opacity="0.4"/>

  <!-- Left vertical backbone -->
  <line x1="18" y1="6" x2="18" y2="24" stroke="#6366F1" stroke-width="1" opacity="0.25"/>

  <!-- Left column nodes — blue (input/knowledge) -->
  <circle cx="18" cy="6" r="3" fill="#6366F1"/>
  <circle cx="18" cy="12" r="3" fill="#818CF8"/>
  <circle cx="18" cy="18" r="3" fill="#818CF8"/>
  <circle cx="18" cy="24" r="3" fill="#6366F1"/>

  <!-- Middle layer nodes — purple (processing) -->
  <circle cx="30" cy="8" r="3.2" fill="#A78BFA"/>
  <circle cx="30" cy="15" r="3.5" fill="#8B5CF6"/>
  <circle cx="30" cy="22" r="3.2" fill="#A78BFA"/>

  <!-- Tip node — green (mastery) -->
  <circle cx="44" cy="15" r="4" fill="#10B981"/>
  <circle cx="44" cy="15" r="7" fill="#10B981" opacity="0.08"/>

  <!-- Small star/sparkle near tip -->
  <path d="M48 9 L48.5 7.5 L49 9 L50.5 9.5 L49 10 L48.5 11.5 L48 10 L46.5 9.5 Z" fill="#F59E0B" opacity="0.7"/>
  <path d="M42 6 L42.3 5 L42.6 6 L43.6 6.3 L42.6 6.6 L42.3 7.6 L42 6.6 L41 6.3 Z" fill="#F59E0B" opacity="0.5"/>
</svg>
