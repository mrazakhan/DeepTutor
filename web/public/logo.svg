<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Open book — left page -->
  <path d="M6 36 L6 30 C6 28 10 26 24 26 L24 40 C10 40 6 38 6 36 Z" fill="url(#g1)" opacity="0.85"/>
  <!-- Open book — right page -->
  <path d="M42 36 L42 30 C42 28 38 26 24 26 L24 40 C38 40 42 38 42 36 Z" fill="url(#g1)" opacity="0.95"/>
  <!-- Book spine highlight -->
  <line x1="24" y1="26" x2="24" y2="40" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <!-- Book bottom edge -->
  <path d="M6 36 C6 38 10 40 24 40 C38 40 42 38 42 36" stroke="url(#g1)" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Neural network connections (rising from book) -->
  <line x1="14" y1="12" x2="24" y2="7" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
  <line x1="34" y1="12" x2="24" y2="7" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
  <line x1="14" y1="12" x2="24" y2="18" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
  <line x1="34" y1="12" x2="24" y2="18" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
  <line x1="14" y1="12" x2="34" y2="12" stroke="url(#g1)" stroke-width="0.8" opacity="0.25"/>
  <line x1="10" y1="22" x2="14" y2="12" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="38" y1="22" x2="34" y2="12" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="10" y1="22" x2="24" y2="18" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="38" y1="22" x2="24" y2="18" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>
  <line x1="10" y1="22" x2="38" y2="22" stroke="url(#g1)" stroke-width="0.6" opacity="0.2"/>

  <!-- Neural network nodes — top layer -->
  <circle cx="24" cy="7" r="3.5" fill="url(#g1)"/>
  <!-- Glow on top node -->
  <circle cx="24" cy="7" r="6" fill="url(#g2)"/>

  <!-- Neural network nodes — middle layer -->
  <circle cx="14" cy="12" r="2.8" fill="url(#g1)"/>
  <circle cx="34" cy="12" r="2.8" fill="url(#g1)"/>

  <!-- Neural network nodes — lower layer (near book) -->
  <circle cx="24" cy="18" r="2.5" fill="url(#g1)" opacity="0.85"/>
  <circle cx="10" cy="22" r="2.2" fill="url(#g1)" opacity="0.7"/>
  <circle cx="38" cy="22" r="2.2" fill="url(#g1)" opacity="0.7"/>
</svg>
