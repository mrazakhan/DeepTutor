<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 52" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- === OPEN BOOK === -->
  <!-- Left page — curved upward like a real open book -->
  <path d="M32 38 C32 36 31 34 28 33 Q18 30 6 32 Q4 32.5 4 34 L4 42 Q4 43.5 6 43 Q18 41 28 43.5 C31 44.2 32 43 32 41 Z"
