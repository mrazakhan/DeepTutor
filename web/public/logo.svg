<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- === BOOK === -->
  <!-- Back cover shadow -->
  <path d="M6 34 L6 31 Q6 29.5 8 29 L40 29 Q42 29.5 42 31 L42 34 Q42 35.5 40 36 L8 36 Q6 35.5 6 34 Z" fill="#6366F1" opacity="0.15"/>
  <!-- Front cover -->
  <path d="M6 32.5 L6 29.5 Q6 28 8 27.5 L40 27.5 Q42 28 42 29.5 L42 32.5 Q42 34 40 34.5 L8 34.5 Q6 34 6 32.5 Z" fill="white" stroke="#6366F1" stroke-width="1.3"/>
  <!-- Page edges between covers -->
  <line x1="8" y1="34.5" x2="40" y2="34.5" stroke="#6366F1" stroke-width="0.4" opacity="0.3"/>
  <line x1="8" y1="35.2" x2="40" y2="35.2" stroke="#6366F1" stroke-width="0.3" opacity="0.2"/>
  <!-- Open pages fanning upward -->
  <path d="M6 28 Q6 24.5 9 23.5 Q16 21.5 24 22.5" stroke="#6366F1" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M42 28 Q42 24.5 39 23.5 Q32 21.5 24 22.5" stroke="#6366F1" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Spine -->
  <line x1="24" y1="22.5" x2="24" y2="28" stroke="#6366F1" stroke-width="0.7" opacity="0.35"/>
  <!-- Text lines left page -->
  <path d="M11 25 Q17 24 22 24.5" stroke="#6366F1" stroke-width="0.5" opacity="0.2"/>
  <path d="M12 26.5 Q17 25.8 21 26.2" stroke="#6366F1" stroke-width="0.5" opacity="0.2"/>
  <!-- Text lines right page -->
  <path d="M26 24.5 Q31 24 37 25" stroke="#6366F1" stroke-width="0.5" opacity="0.2"/>
  <path d="M27 26.2 Q31 25.8 36 26.5" stroke="#6366F1" stroke-width="0.5" opacity="0.2"/>

  <!-- === NEURAL NETWORK "|>" shape === -->
  <!-- Left vertical column (the "|") — 4 nodes, blue shades -->
  <!-- Right triangle tip (the ">") — nodes converging to a point -->

  <!-- Connections from left column to middle layer -->
  <line x1="13" y1="4" x2="26" y2="6" stroke="#818CF8" stroke-width="0.7" opacity="0.35"/>
  <line x1="13" y1="4" x2="25" y2="10.5" stroke="#818CF8" stroke-width="0.7" opacity="0.3"/>
  <line x1="13" y1="8" x2="26" y2="6" stroke="#818CF8" stroke-width="0.7" opacity="0.35"/>
  <line x1="13" y1="8" x2="25" y2="10.5" stroke="#818CF8" stroke-width="0.7" opacity="0.35"/>
  <line x1="13" y1="8" x2="25" y2="15" stroke="#818CF8" stroke-width="0.7" opacity="0.3"/>
  <line x1="13" y1="12.5" x2="25" y2="10.5" stroke="#818CF8" stroke-width="0.7" opacity="0.35"/>
  <line x1="13" y1="12.5" x2="25" y2="15" stroke="#818CF8" stroke-width="0.7" opacity="0.35"/>
  <line x1="13" y1="12.5" x2="26" y2="6" stroke="#818CF8" stroke-width="0.6" opacity="0.2"/>
  <line x1="13" y1="17" x2="25" y2="15" stroke="#818CF8" stroke-width="0.7" opacity="0.35"/>
  <line x1="13" y1="17" x2="25" y2="10.5" stroke="#818CF8" stroke-width="0.7" opacity="0.3"/>

  <!-- Connections from middle layer to tip -->
  <line x1="26" y1="6" x2="36" y2="10.5" stroke="#A78BFA" stroke-width="0.9" opacity="0.4"/>
  <line x1="25" y1="10.5" x2="36" y2="10.5" stroke="#A78BFA" stroke-width="0.9" opacity="0.45"/>
  <line x1="25" y1="15" x2="36" y2="10.5" stroke="#A78BFA" stroke-width="0.9" opacity="0.4"/>

  <!-- Left column backbone -->
  <line x1="13" y1="4" x2="13" y2="17" stroke="#6366F1" stroke-width="0.9" opacity="0.3"/>

  <!-- Left column nodes "|" — cool blues (starting knowledge) -->
  <circle cx="13" cy="4" r="2.3" fill="#6366F1"/>
  <circle cx="13" cy="8" r="2.3" fill="#818CF8"/>
  <circle cx="13" cy="12.5" r="2.3" fill="#818CF8"/>
  <circle cx="13" cy="17" r="2.3" fill="#6366F1"/>

  <!-- Middle layer nodes — transitioning purple/amber -->
  <circle cx="26" cy="6" r="2.5" fill="#A78BFA"/>
  <circle cx="25" cy="10.5" r="2.8" fill="#8B5CF6"/>
  <circle cx="25" cy="15" r="2.5" fill="#A78BFA"/>

  <!-- Tip node ">" — green success/mastery -->
  <circle cx="36" cy="10.5" r="3.2" fill="#10B981"/>
  <!-- Glow ring -->
  <circle cx="36" cy="10.5" r="5.5" fill="#10B981" opacity="0.08"/>
  <!-- Small spark/star on tip -->
  <line x1="36" y1="7.5" x2="36" y2="8.5" stroke="#10B981" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
  <line x1="33.2" y1="10.5" x2="34" y2="10.5" stroke="#10B981" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
  <line x1="38" y1="10.5" x2="38.8" y2="10.5" stroke="#10B981" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
</svg>
