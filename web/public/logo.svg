  <!-- Right page — curved upward -->
  <path d="M32 38 C32 36 33 34 36 33 Q46 30 58 32 Q60 32.5 60 34 L60 42 Q60 43.5 58 43 Q46 41 36 43.5 C33 44.2 32 43 32 41 Z"
