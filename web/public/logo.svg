<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Brain outline (left hemisphere) -->
  <path d="M24 38 C24 38 24 10 24 10 C24 6 20 4 16 4 C12 4 8 6 6 10 C4 14 4 18 6 22 C4 24 3 28 5 32 C7 36 12 38 16 38 Z"
        fill="url(#g2)" stroke="url(#g1)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Brain outline (right hemisphere) -->
  <path d="M24 38 C24 38 24 10 24 10 C24 6 28 4 32 4 C36 4 40 6 42 10 C44 14 44 18 42 22 C44 24 45 28 43 32 C41 36 36 38 32 38 Z"
        fill="url(#g2)" stroke="url(#g1)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Brain folds (left) -->
  <path d="M10 14 C14 16 18 14 22 12" stroke="url(#g3)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M8 22 C12 20 16 22 22 20" stroke="url(#g3)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M10 30 C14 28 18 30 22 28" stroke="url(#g3)" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Brain folds (right) -->
  <path d="M38 14 C34 16 30 14 26 12" stroke="url(#g3)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M40 22 C36 20 32 22 26 20" stroke="url(#g3)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M38 30 C34 28 30 30 26 28" stroke="url(#g3)" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Neural network connections -->
  <line x1="12" y1="12" x2="20" y2="20" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="12" y1="12" x2="24" y2="16" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="36" y1="12" x2="28" y2="20" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="36" y1="12" x2="24" y2="16" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="20" y1="20" x2="16" y2="28" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="28" y1="20" x2="32" y2="28" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="20" y1="20" x2="28" y2="20" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="16" y1="28" x2="24" y2="24" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="32" y1="28" x2="24" y2="24" stroke="url(#g1)" stroke-width="0.8" opacity="0.4"/>
  <line x1="16" y1="28" x2="32" y2="28" stroke="url(#g1)" stroke-width="0.8" opacity="0.35"/>

  <!-- Neural network nodes -->
  <circle cx="12" cy="12" r="2.5" fill="url(#g1)"/>
  <circle cx="36" cy="12" r="2.5" fill="url(#g1)"/>
  <circle cx="24" cy="16" r="3" fill="url(#g1)"/>
  <circle cx="20" cy="20" r="2" fill="url(#g1)" opacity="0.8"/>
  <circle cx="28" cy="20" r="2" fill="url(#g1)" opacity="0.8"/>
  <circle cx="24" cy="24" r="2.5" fill="url(#g1)" opacity="0.9"/>
  <circle cx="16" cy="28" r="2" fill="url(#g1)" opacity="0.7"/>
  <circle cx="32" cy="28" r="2" fill="url(#g1)" opacity="0.7"/>

  <!-- Central glow on main node -->
  <circle cx="24" cy="16" r="5" fill="url(#g2)"/>

  <!-- Brainstem / base -->
  <path d="M20 36 C20 40 22 44 24 44 C26 44 28 40 28 36" stroke="url(#g1)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
