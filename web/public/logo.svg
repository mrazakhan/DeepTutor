<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="success" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- === OPEN BOOK (outline only, indigo tone) === -->
  <!-- Left page -->
  <path d="M5 38 L5 31 Q5 29 8 28 Q16 26 24 26 L24 40 Q16 40 8 41 Q5 41 5 39 Z"
        fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right page -->
  <path d="M43 38 L43 31 Q43 29 40 28 Q32 26 24 26 L24 40 Q32 40 40 41 Q43 41 43 39 Z"
        fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Spine -->
  <line x1="24" y1="26" x2="24" y2="40" stroke="#6366F1" stroke-width="1" opacity="0.5"/>
  <!-- Page lines left -->
  <line x1="10" y1="31" x2="21" y2="30" stroke="#6366F1" stroke-width="0.6" opacity="0.3"/>
  <line x1="10" y1="34" x2="21" y2="33" stroke="#6366F1" stroke-width="0.6" opacity="0.3"/>
  <line x1="10" y1="37" x2="21" y2="36" stroke="#6366F1" stroke-width="0.6" opacity="0.3"/>
  <!-- Page lines right -->
  <line x1="38" y1="31" x2="27" y2="30" stroke="#6366F1" stroke-width="0.6" opacity="0.3"/>
  <line x1="38" y1="34" x2="27" y2="33" stroke="#6366F1" stroke-width="0.6" opacity="0.3"/>
  <line x1="38" y1="37" x2="27" y2="36" stroke="#6366F1" stroke-width="0.6" opacity="0.3"/>

  <!-- === NEURAL NETWORK (above book, showing upward progress) === -->

  <!-- Connections — bottom layer to middle -->
  <line x1="12" y1="22" x2="18" y2="15" stroke="url(#g1)" stroke-width="0.9" opacity="0.35"/>
  <line x1="12" y1="22" x2="30" y2="15" stroke="url(#g1)" stroke-width="0.7" opacity="0.2"/>
  <line x1="36" y1="22" x2="30" y2="15" stroke="url(#g1)" stroke-width="0.9" opacity="0.35"/>
  <line x1="36" y1="22" x2="18" y2="15" stroke="url(#g1)" stroke-width="0.7" opacity="0.2"/>
  <line x1="24" y1="20" x2="18" y2="15" stroke="url(#g1)" stroke-width="0.9" opacity="0.35"/>
  <line x1="24" y1="20" x2="30" y2="15" stroke="url(#g1)" stroke-width="0.9" opacity="0.35"/>

  <!-- Connections — middle layer to top -->
  <line x1="18" y1="15" x2="24" y2="7" stroke="url(#success)" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="15" x2="24" y2="7" stroke="url(#success)" stroke-width="1" opacity="0.5"/>

  <!-- Bottom layer nodes (near book — starting knowledge) -->
  <circle cx="12" cy="22" r="2.2" fill="url(#g1)" opacity="0.6"/>
  <circle cx="24" cy="20" r="2.2" fill="url(#g1)" opacity="0.7"/>
  <circle cx="36" cy="22" r="2.2" fill="url(#g1)" opacity="0.6"/>

  <!-- Middle layer nodes (learning in progress) -->
  <circle cx="18" cy="15" r="2.8" fill="url(#g1)"/>
  <circle cx="30" cy="15" r="2.8" fill="url(#g1)"/>

  <!-- Top node (success / mastery) -->
  <circle cx="24" cy="7" r="3.5" fill="url(#success)"/>
  <!-- Glow around top node -->
  <circle cx="24" cy="7" r="6.5" fill="#10B981" opacity="0.1"/>

  <!-- Small upward arrow / chevron inside top node -->
  <polyline points="22,8 24,5.5 26,8" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
