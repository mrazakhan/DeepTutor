<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" fill="none">

  <!-- === OPEN BOOK (front view, pages fanning out) === -->
  <!-- Outer page layers (back pages, wider) -->
  <path d="M40 48 Q38 44 20 40 Q8 37 2 38 Q0 38.5 2 40 Q10 42 22 46 Q34 50 40 52 Z" fill="#C7D2FE" opacity="0.4"/>
  <path d="M40 48 Q42 44 60 40 Q72 37 78 38 Q80 38.5 78 40 Q70 42 58 46 Q46 50 40 52 Z" fill="#C7D2FE" opacity="0.4"/>

  <!-- Middle page layers -->
  <path d="M40 47 Q38 43 22 40 Q12 38 6 39 Q4 39.5 6 41 Q14 43 24 46 Q35 49 40 51 Z" fill="#DDD6FE" opacity="0.5"/>
  <path d="M40 47 Q42 43 58 40 Q68 38 74 39 Q76 39.5 74 41 Q66 43 56 46 Q45 49 40 51 Z" fill="#DDD6FE" opacity="0.5"/>

  <!-- Inner page layers (front pages) -->
  <path d="M40 46 Q38 42 24 40 Q16 39 10 40 Q8 40.5 10 42 Q18 43.5 26 46 Q36 48.5 40 50 Z" fill="#EDE9FE" opacity="0.6"/>
  <path d="M40 46 Q42 42 56 40 Q64 39 70 40 Q72 40.5 70 42 Q62 43.5 54 46 Q44 48.5 40 50 Z" fill="#EDE9FE" opacity="0.6"/>

  <!-- Top page surface (the open pages you read) -->
  <path d="M40 45 Q37 41 24 39.5 Q16 38.5 10 39.5 Q8 40 10 41.5 Q18 42.5 26 45 Q36 47.5 40 49 Z"
        fill="white" stroke="#6366F1" stroke-width="1.2"/>
  <path d="M40 45 Q43 41 56 39.5 Q64 38.5 70 39.5 Q72 40 70 41.5 Q62 42.5 54 45 Q44 47.5 40 49 Z"
        fill="white" stroke="#6366F1" stroke-width="1.2"/>

  <!-- Spine/center -->
  <path d="M40 45 L40 49" stroke="#6366F1" stroke-width="1" opacity="0.5"/>

  <!-- Text lines on left page -->
  <path d="M15 40.5 Q26 39.5 36 42" stroke="#A5B4FC" stroke-width="0.6" opacity="0.35"/>
  <path d="M16 42 Q26 41 36 43.5" stroke="#A5B4FC" stroke-width="0.6" opacity="0.3"/>
  <path d="M18 43.5 Q27 42.5 36 45" stroke="#A5B4FC" stroke-width="0.5" opacity="0.25"/>

  <!-- Text lines on right page -->
  <path d="M65 40.5 Q54 39.5 44 42" stroke="#A5B4FC" stroke-width="0.6" opacity="0.35"/>
  <path d="M64 42 Q54 41 44 43.5" stroke="#A5B4FC" stroke-width="0.6" opacity="0.3"/>
  <path d="M62 43.5 Q53 42.5 44 45" stroke="#A5B4FC" stroke-width="0.5" opacity="0.25"/>

  <!-- === NEURAL NETWORK rising from book in inverse-V (∧) shape === -->

  <!-- Connections: bottom layer (wide) to middle layer -->
  <line x1="18" y1="30" x2="28" y2="20" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
  <line x1="18" y1="30" x2="40" y2="18" stroke="#818CF8" stroke-width="0.8" opacity="0.2"/>
  <line x1="40" y1="32" x2="28" y2="20" stroke="#818CF8" stroke-width="0.8" opacity="0.2"/>
  <line x1="40" y1="32" x2="40" y2="18" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="32" x2="52" y2="20" stroke="#818CF8" stroke-width="0.8" opacity="0.2"/>
  <line x1="62" y1="30" x2="52" y2="20" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
  <line x1="62" y1="30" x2="40" y2="18" stroke="#818CF8" stroke-width="0.8" opacity="0.2"/>

  <!-- Connections: middle layer to upper layer -->
  <line x1="28" y1="20" x2="33" y2="11" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>
  <line x1="28" y1="20" x2="47" y2="11" stroke="#A78BFA" stroke-width="0.8" opacity="0.2"/>
  <line x1="40" y1="18" x2="33" y2="11" stroke="#A78BFA" stroke-width="0.8" opacity="0.2"/>
  <line x1="40" y1="18" x2="47" y2="11" stroke="#A78BFA" stroke-width="0.8" opacity="0.2"/>
  <line x1="52" y1="20" x2="47" y2="11" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>
  <line x1="52" y1="20" x2="33" y2="11" stroke="#A78BFA" stroke-width="0.8" opacity="0.2"/>

  <!-- Connections: upper layer to apex -->
  <line x1="33" y1="11" x2="40" y2="4" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <line x1="47" y1="11" x2="40" y2="4" stroke="#10B981" stroke-width="1" opacity="0.4"/>

  <!-- Bottom layer nodes — blue (wide, near book) -->
  <circle cx="18" cy="30" r="3" fill="none" stroke="#6366F1" stroke-width="1.5"/>
  <circle cx="40" cy="32" r="3.2" fill="none" stroke="#6366F1" stroke-width="1.8"/>
  <circle cx="62" cy="30" r="3" fill="none" stroke="#6366F1" stroke-width="1.5"/>

  <!-- Middle layer nodes — purple -->
  <circle cx="28" cy="20" r="3" fill="none" stroke="#818CF8" stroke-width="1.5"/>
  <circle cx="40" cy="18" r="3.2" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="52" cy="20" r="3" fill="none" stroke="#818CF8" stroke-width="1.5"/>

  <!-- Upper layer nodes — purple -->
  <circle cx="33" cy="11" r="3" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
  <circle cx="47" cy="11" r="3" fill="none" stroke="#A78BFA" stroke-width="1.5"/>

  <!-- Apex node — green (mastery/success) -->
  <circle cx="40" cy="4" r="3.5" fill="none" stroke="#10B981" stroke-width="2"/>
  <!-- Glow -->
  <circle cx="40" cy="4" r="6" fill="#10B981" opacity="0.07"/>

  <!-- Stars (like reference image) -->
  <path d="M12 18 L12.8 15.5 L13.6 18 L16 18.8 L13.6 19.6 L12.8 22 L12 19.6 L9.5 18.8 Z" fill="#F59E0B" opacity="0.7"/>
  <path d="M40 -2 L40.6 -4 L41.2 -2 L43 -1.4 L41.2 -0.8 L40.6 1 L40 -0.8 L38 -1.4 Z" fill="#F59E0B" opacity="0.55"/>
  <path d="M67 18 L67.8 15.5 L68.6 18 L71 18.8 L68.6 19.6 L67.8 22 L67 19.6 L64.5 18.8 Z" fill="#F59E0B" opacity="0.7"/>
</svg>
