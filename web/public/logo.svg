  <!-- Stacked pages underneath (book thickness) -->
  <path d="M5 43 Q18 41.5 28 44 C31 44.7 32 44 32 42" stroke="#6366F1" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M5.5 44.5 Q18 43 28 45 C31 45.5 32 45 32 43.5" stroke="#6366F1" stroke-width="0.6" fill="none" opacity="0.2"/>
  <path d="M59 43 Q46 41.5 36 44 C33 44.7 32 44 32 42" stroke="#6366F1" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M58.5 44.5 Q46 43 36 45 C33 45.5 32 45 32 43.5" stroke="#6366F1" stroke-width="0.6" fill="none" opacity="0.2"/>

  <!-- Spine -->
  <path d="M32 33 C32 35 32 39 32 41" stroke="#6366F1" stroke-width="1" opacity="0.4"/>

  <!-- Text lines left page -->
  <path d="M10 35 Q18 33.5 27 35" stroke="#6366F1" stroke-width="0.6" opacity="0.2" stroke-linecap="round"/>
  <path d="M10 37.5 Q18 36 27 37.5" stroke="#6366F1" stroke-width="0.6" opacity="0.2" stroke-linecap="round"/>
  <path d="M11 40 Q18 38.5 27 40" stroke="#6366F1" stroke-width="0.5" opacity="0.15" stroke-linecap="round"/>

  <!-- Text lines right page -->
  <path d="M54 35 Q46 33.5 37 35" stroke="#6366F1" stroke-width="0.6" opacity="0.2" stroke-linecap="round"/>
  <path d="M54 37.5 Q46 36 37 37.5" stroke="#6366F1" stroke-width="0.6" opacity="0.2" stroke-linecap="round"/>
  <path d="M53 40 Q46 38.5 37 40" stroke="#6366F1" stroke-width="0.5" opacity="0.15" stroke-linecap="round"/>

  <!-- === NEURAL NETWORK |> (outline-only neurons) === -->

  <!-- Connections: left column to middle -->
  <line x1="18" y1="6" x2="30" y2="8" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="6" x2="30" y2="15" stroke="#818CF8" stroke-width="0.7" opacity="0.2"/>
  <line x1="18" y1="12" x2="30" y2="8" stroke="#818CF8" stroke-width="0.7" opacity="0.2"/>
  <line x1="18" y1="12" x2="30" y2="15" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="12" x2="30" y2="22" stroke="#818CF8" stroke-width="0.7" opacity="0.2"/>
  <line x1="18" y1="18" x2="30" y2="15" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="18" x2="30" y2="22" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="24" x2="30" y2="22" stroke="#818CF8" stroke-width="0.9" opacity="0.3"/>
  <line x1="18" y1="24" x2="30" y2="15" stroke="#818CF8" stroke-width="0.7" opacity="0.2"/>

  <!-- Connections: middle to tip -->
  <line x1="30" y1="8" x2="44" y2="15" stroke="#A78BFA" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="15" x2="44" y2="15" stroke="#A78BFA" stroke-width="1.1" opacity="0.45"/>
  <line x1="30" y1="22" x2="44" y2="15" stroke="#A78BFA" stroke-width="1" opacity="0.4"/>

  <!-- Left backbone -->
  <line x1="18" y1="6" x2="18" y2="24" stroke="#6366F1" stroke-width="0.9" opacity="0.2"/>

  <!-- Left column nodes — blue outlines (input/knowledge) -->
  <circle cx="18" cy="6" r="3" fill="none" stroke="#6366F1" stroke-width="1.5"/>
  <circle cx="18" cy="12" r="3" fill="none" stroke="#818CF8" stroke-width="1.5"/>
  <circle cx="18" cy="18" r="3" fill="none" stroke="#818CF8" stroke-width="1.5"/>
  <circle cx="18" cy="24" r="3" fill="none" stroke="#6366F1" stroke-width="1.5"/>

  <!-- Middle layer nodes — purple outlines (processing) -->
  <circle cx="30" cy="8" r="3.2" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
  <circle cx="30" cy="15" r="3.5" fill="none" stroke="#8B5CF6" stroke-width="1.8"/>
  <circle cx="30" cy="22" r="3.2" fill="none" stroke="#A78BFA" stroke-width="1.5"/>

  <!-- Tip node — green outline (mastery) -->
  <circle cx="44" cy="15" r="4" fill="none" stroke="#10B981" stroke-width="2"/>
  <!-- Glow -->
  <circle cx="44" cy="15" r="7" fill="#10B981" opacity="0.06"/>

  <!-- Small stars near tip -->
  <path d="M49 9 L49.5 7.5 L50 9 L51.5 9.5 L50 10 L49.5 11.5 L49 10 L47.5 9.5 Z" fill="#F59E0B" opacity="0.65"/>
  <path d="M46 5.5 L46.3 4.5 L46.6 5.5 L47.6 5.8 L46.6 6.1 L46.3 7.1 L46 6.1 L45 5.8 Z" fill="#F59E0B" opacity="0.45"/>
